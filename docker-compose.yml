services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesachor_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tesachor_website}
      DB_USERNAME: ${DB_USERNAME:-tesachor}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      AUTORUN_MIGRATIONS: "true"
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tesachor_network

  db:
    image: mysql:8.0
    container_name: tesachor_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tesachor_website}
      MYSQL_USER: ${DB_USERNAME:-tesachor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - tesachor_db_data:/var/lib/mysql
    networks:
      - tesachor_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tesachor_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - tesachor_redis_data:/data
    networks:
      - tesachor_network

networks:
  tesachor_network:
    driver: bridge

volumes:
  tesachor_db_data:
    driver: local
  tesachor_redis_data:
    driver: local
